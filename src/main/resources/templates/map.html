<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title>Kakao Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <style>
        html, body, #map { margin:0; padding:0; width:100%; height:100%; }
    </style>
    <!-- ✅ Kakao JS SDK -->
    <script th:src="|https://dapi.kakao.com/v2/maps/sdk.js?appkey=${kakaoApiKey}&autoload=false|"></script>
</head>
<body>
<div id="map"></div>

<script th:inline="javascript">
    kakao.maps.load(function() {
        // ✅ 안전한 좌표 변환 함수
        function safeLatLng(lat, lng) {
            if (lat == null || lng == null) return null;
            const nLat = Number(lat);
            const nLng = Number(lng);
            if (isNaN(nLat) || isNaN(nLng)) return null;
            return new kakao.maps.LatLng(nLat, nLng);
        }

        // ✅ 서버에서 넘어온 파라미터
        var startLat   = [[${startLat} ?: 'null']];
        var startLng   = [[${startLng} ?: 'null']];
        var endLat     = [[${endLat} ?: 'null']];
        var endLng     = [[${endLng} ?: 'null']];
        var currentLat = [[${currentLat} ?: 'null']];
        var currentLng = [[${currentLng} ?: 'null']];

        // ✅ SVG → DataURL 변환 함수
        function svgToDataUrl(svg) {
            return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
        }

        // ✅ SVG 아이콘 정의
        var startSvg = `
      <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 24 24">
        <circle cx="12" cy="10" r="8" fill="#318643" stroke="black" stroke-width="1"/>
        <path d="M12 22 C10 18, 14 18, 12 22 Z" fill="#318643" stroke="black" stroke-width="1"/>
        <text x="12" y="10" text-anchor="middle" dominant-baseline="middle"
              font-size="5" font-family="Arial" font-weight="bold" fill="white">출발</text>
      </svg>
    `;
        var endSvg = `
      <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 24 24">
        <circle cx="12" cy="10" r="8" fill="#e53935" stroke="black" stroke-width="1"/>
        <path d="M12 22 C10 18, 14 18, 12 22 Z" fill="#e53935" stroke="black" stroke-width="1"/>
        <text x="12" y="10" text-anchor="middle" dominant-baseline="middle"
              font-size="5" font-family="Arial" font-weight="bold" fill="white">도착</text>
      </svg>
    `;
        var currentSvg = `
      <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 30 30">
        <circle cx="15" cy="15" r="8" fill="#1976d2" stroke="white" stroke-width="3"/>
      </svg>
    `;

        var startImage   = svgToDataUrl(startSvg);
        var endImage     = svgToDataUrl(endSvg);
        var currentImage = svgToDataUrl(currentSvg);

        // ✅ 지도 기본 생성
        var map = new kakao.maps.Map(document.getElementById('map'), {
            center: new kakao.maps.LatLng(37.5665, 126.978),
            level: 4
        });
        window.map = map;

        var positions = [];

        // 출발지 마커
        var startPos = safeLatLng(startLat, startLng);
        if (startPos) {
            positions.push(startPos);
            window.startMarker = new kakao.maps.Marker({
                position: startPos,
                image: new kakao.maps.MarkerImage(startImage, new kakao.maps.Size(60, 60), { offset: new kakao.maps.Point(30, 55) }),
                map: map
            });
        }

        // 도착지 마커
        var endPos = safeLatLng(endLat, endLng);
        if (endPos) {
            positions.push(endPos);
            window.endMarker = new kakao.maps.Marker({
                position: endPos,
                image: new kakao.maps.MarkerImage(endImage, new kakao.maps.Size(60, 60), { offset: new kakao.maps.Point(30, 55) }),
                map: map
            });
        }

        // 현재 위치 마커
        var currentPos = safeLatLng(currentLat, currentLng);
        if (currentPos) {
            positions.push(currentPos);
            window.currentMarker = new kakao.maps.Marker({
                position: currentPos,
                image: new kakao.maps.MarkerImage(currentImage, new kakao.maps.Size(30, 30), { offset: new kakao.maps.Point(15, 15) }),
                map: map
            });
        }

        // ✅ 초기 중심 계산 (한 번만 실행)
        var initialized = false;
        function fitInitialBounds() {
            if (positions.length === 0) {
                map.setCenter(new kakao.maps.LatLng(37.5665, 126.978));
                map.setLevel(4);
                return;
            }

            function applyBounds() {
                map.relayout();
                if (positions.length === 1) {
                    map.setCenter(positions[0]);
                    map.setLevel(3);
                } else {
                    var bounds = new kakao.maps.LatLngBounds();
                    positions.forEach(p => bounds.extend(p));
                    map.setBounds(bounds);

                    // 👉 자동으로 잡힌 레벨에서 한 단계만 더 줌 아웃
                    setTimeout(function() {
                        map.setLevel(map.getLevel() + 1);
                    }, 0);
                }
            }

            // 1차: 즉시
            applyBounds();
            // 2차: 약간 늦게
            setTimeout(applyBounds, 300);
            // 3차: 더 늦게 (WebView 렌더링 지연 대비)
            setTimeout(applyBounds, 800);
        }
        fitInitialBounds();


        // ✅ 리사이즈 대응
        window.addEventListener("resize", function() {
            map.relayout();
        });
    });
</script>
</body>
</html>
